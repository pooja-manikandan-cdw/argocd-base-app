name: argocd-base-app CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Server tests ─────────────────────────────────────────────────
  test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest tests/ -v

  # ─── Client tests ─────────────────────────────────────────────────
  test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # ─── PR: validate Docker builds (no push) ─────────────────────────
  build-validation:
    if: github.event_name == 'pull_request'
    needs: [test-server, test-client]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build server image (validation)
        run: docker build -t argocd-server:pr-${{ github.event.pull_request.number }} ./server

      - name: Build client image (validation)
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8000 \
            -t argocd-client:pr-${{ github.event.pull_request.number }} \
            ./client

  # ─── Push to main: build + push + update deploy repo ─────────────
  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-server, test-client]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image version tag
        id: version
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push server image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/argocd-server:${{ steps.version.outputs.tag }} \
            ./server
          docker push ${{ secrets.DOCKER_USERNAME }}/argocd-server:${{ steps.version.outputs.tag }}

      - name: Build and push client image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8000 \
            -t ${{ secrets.DOCKER_USERNAME }}/argocd-client:${{ steps.version.outputs.tag }} \
            ./client
          docker push ${{ secrets.DOCKER_USERNAME }}/argocd-client:${{ steps.version.outputs.tag }}

      - name: Print pushed image versions
        run: |
          echo "==========================================="
          echo "Docker images successfully pushed:"
          echo "  ${{ secrets.DOCKER_USERNAME }}/argocd-server:${{ steps.version.outputs.tag }}"
          echo "  ${{ secrets.DOCKER_USERNAME }}/argocd-client:${{ steps.version.outputs.tag }}"
          echo "==========================================="

      - name: Checkout deploy repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/argocd-deploy-app
          token: ${{ secrets.GH_PAT }}
          path: deploy-repo

      - name: Update image tags in deployment manifests
        run: |
          sed -i "s|\(image: .*/argocd-server:\).*|\1${{ steps.version.outputs.tag }}|" deploy-repo/server/deployment.yaml
          sed -i "s|\(image: .*/argocd-client:\).*|\1${{ steps.version.outputs.tag }}|" deploy-repo/client/deployment.yaml

      - name: Raise PR to deploy repository
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="update-image-${{ steps.version.outputs.tag }}"
          git checkout -b $BRANCH
          git add .
          git commit -m "chore: update image tags to ${{ steps.version.outputs.tag }}"
          git push origin $BRANCH
          gh pr create \
            --repo ${{ github.repository_owner }}/argocd-deploy-app \
            --base main \
            --head $BRANCH \
            --title "chore: update image tags to ${{ steps.version.outputs.tag }}" \
            --body "Automated PR: update container images to \`${{ steps.version.outputs.tag }}\`"
